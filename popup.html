<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 240px; font-family: -apple-system, sans-serif; padding: 16px; margin: 0; background: #fefefe; }
    h2 { margin: 0 0 8px; font-size: 14px; color: #1f2d5c; }
    .status { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 11px; }
    .ok { background: #d1fae5; color: #065f46; }
    .err { background: #fee2e2; color: #991b1b; }
    p { font-size: 12px; color: #6b7280; line-height: 1.4; margin: 8px 0 0; }
  </style>
</head>
<body>
  <h2>🤖 Ranukita Bridge</h2>
  <div id="status" class="status">cargando…</div>
  <p>Esta extension permite que Ranukita controle tu Chrome real con todas tus sesiones logueadas.</p>
  <p>Server local: <code>ws://127.0.0.1:9223</code></p>
  <script>
    (async () => {
      const s = document.getElementById("status");
      try {
        const r = await fetch("http://127.0.0.1:9224/health").then(x=>x.json()).catch(()=>null);
        if (r && r.ok) {
          s.textContent = "✓ Server ok · " + (r.clients||0) + " ext conectada(s)";
          s.className = "status ok";
        } else {
          s.textContent = "✗ Server caído (correr ranukita-ext-server)";
          s.className = "status err";
        }
      } catch (e) {
        s.textContent = "✗ Sin conexión al server";
        s.className = "status err";
      }
    })();
  </script>
</body>
</html>
